[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-as-judge-learning"
version = "0.1.0"
description = "A production-oriented LLM-as-a-Judge learning project"
requires-python = ">=3.9"
dependencies = [
    "openai>=1.42,<3",
    "pydantic>=2.9,<3",
]

[project.scripts]
llm-judge-run = "llm_judge.dataset_runner:main"
llm-judge-metrics = "llm_judge.reliability:main"
llm-judge-stability = "llm_judge.stability:main"
llm-judge-error-analysis = "llm_judge.error_analysis:main"
llm-judge-production-gate = "llm_judge.production_gate:main"
llm-judge-adversarial = "llm_judge.adversarial:main"
llm-judge-calibration = "llm_judge.calibration:main"

[tool.setuptools.packages.find]
where = ["src"]
